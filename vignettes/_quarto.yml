# Shared Quarto project config for pkgdown articles.
# pkgdown treats vignettes/ as a Quarto project and reads this file
# (it does not honour `from:` in the repository-root _pkgdown.yml).
# https://pkgdown.r-lib.org/articles/quarto.html
#
# `from: markdown+emoji` expands GitHub shortcodes such as :one: and
# :warning: in HTML. Document YAML can still override per article.
project:
  render: ["*.qmd"]
from: markdown+emoji
date-format: "D MMM YYYY"

extensions:
  highlight-text:
    styles:
      highlight:
        colour: "#7a1f1f"
        bg-colour: "#f4c7c3"

# Standalone renders (quarto render): TOC and section numbers to level 4,
# the deepest heading level allowed in vignettes. On the pkgdown site the
# sidebar is built by pkgdown instead (see _pkgdown.yml, after_body).
format:
  html:
    title-block-banner: ../man/figures/logo.svg
    css: decovart-html.css
    toc-depth: 4
    number-depth: 4
    # Code chunks folded by default, with a page-level Code menu.
    code-fold: true
    code-summary: "Show the code"
    code-tools: true
    # Embedded cells from notation.qmd link the full table in the margin.
    # https://quarto.org/docs/authoring/notebook-embed.html#linked-source-notebooks
    notebook-links: true

filters:
  - highlight-text
  # pkgdown's minimal HTML turns callouts into blockquotes; keep their type.
  # Same file twice: it tags callouts before rendering, wraps them after.
  - at: pre-render
    path: pkgdown-callouts.lua
  - at: post-render
    path: pkgdown-callouts.lua
