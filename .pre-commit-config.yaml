# Pre-commit hooks for DeCovarT
# Framework: https://pre-commit.com
# R hooks:   https://lorenzwalthert.github.io/precommit/
# Inspired by ropensci/skimr, tailored for Air + Quarto README.
#
# Global exclude: build artefacts, article sources, and any dotfile/dotfolder.
exclude: |
  (?x)^(
    (article|output|data|docs)/.*|
    \..*
  )$

repos:
  # Air formatter (replaces styler / style-files)
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.11.0
    hooks:
      - id: air-format

  # R-specific hooks from {precommit}
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9030
    hooks:
      - id: lintr
        args: [--warn_only]
        verbose: true
        exclude: '^(vignettes/)'
      - id: parsable-R
      - id: no-browser-statement
      - id: use-tidy-description
      - id: deps-in-desc
        exclude: '^(scripts/|vignettes/)'

  # Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: end-of-file-fixer
        exclude: '\.Rd$'
      - id: trailing-whitespace
        exclude: '\.Rd$'
