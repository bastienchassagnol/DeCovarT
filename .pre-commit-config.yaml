# Pre-commit hooks for DeCovarT
# Framework: https://pre-commit.com
# R hooks:   https://lorenzwalthert.github.io/precommit/
# Inspired by ropensci/skimr, tailored for Air + Quarto README.
#
# Global exclude: build artefacts, article sources, and any dotfile/dotfolder.
exclude: |
  (?x)^(
    (article|output|data|docs)/.*|
    \..*
  )$

repos:
  # Air formatter (replaces styler / style-files)
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.11.0
    hooks:
      - id: air-format

  # R hooks of {precommit}, run from the user library (no renv: this
  # package does not use one, and `language: r` hooks always build a renv
  # environment). Needs the {precommit} R package installed.
  - repo: local
    hooks:
      - id: parsable-R
        name: parsable-R
        entry: scripts/dev/precommit_hook.sh parsable-R
        language: system
        files: '\.[rR](md)?$'
      - id: no-browser-statement
        name: no-browser-statement
        entry: scripts/dev/precommit_hook.sh no-browser-statement
        language: system
        files: '\.[rR]$'
      - id: use-tidy-description
        name: use-tidy-description
        entry: scripts/dev/precommit_hook.sh use-tidy-description
        language: system
        files: '^DESCRIPTION$'
      - id: deps-in-desc
        name: deps-in-desc
        entry: scripts/dev/precommit_hook.sh deps-in-desc
        language: system
        files: '(\.[rR]profile|\.R|\.Rmd|\.r|\.rmd)$'
        exclude: '^(scripts/|vignettes/)'

  # Local lintr (warn-only).
  - repo: local
    hooks:
      - id: lintr
        name: lintr
        entry: Rscript scripts/dev/lintr_precommit.R
        language: system
        files: '\.[rR]$'
        exclude: '^(vignettes/)'
        pass_filenames: true
        verbose: true

  # Scripts and vignettes use the exported API only: a function they need
  # is exported (@export) and documented, never reached with ::: or
  # asNamespace(). pkgcheck does not see scripts/ (.Rbuildignore).
  - repo: local
    hooks:
      - id: no-decovart-internals
        name: no DeCovarT internals in scripts/ and vignettes/
        entry: 'DeCovarT:::|asNamespace\(.DeCovarT.\)'
        language: pygrep
        files: '^(scripts|vignettes)/.*\.(R|r|qmd|Rmd)$'

  # Vignette headings stop at level 4: the pkgdown sidebar lists levels 1-4
  # (pkgdown/assets/toc-depth.js).
  - repo: local
    hooks:
      - id: no-level5-headings
        name: no level-5 headings in vignettes
        entry: '^#{5,} '
        language: pygrep
        files: '^vignettes/.*\.qmd$'

  # Generic hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: end-of-file-fixer
        exclude: '(?x)(\.Rd$|slides/_extensions/|vignettes/_extensions/)'
      - id: trailing-whitespace
        exclude: '(?x)(\.Rd$|slides/_extensions/|vignettes/_extensions/)'

  # Bibliography hygiene (Zotero/BBT). always_run because global exclude
  # skips article/; the script still reads article/ + inst/ on disk.
  - repo: local
    hooks:
      - id: check-bibliography
        name: check-bibliography
        entry: python3 scripts/curate_bibliography/check_bibliography.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
