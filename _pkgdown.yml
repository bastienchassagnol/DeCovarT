reference:
  - title: Main deconvolution function
    desc: |
      Top-level function to deconvolve a matrix of bulk expression samples
      using any combination of deconvolution algorithms in parallel.
    contents:
      - deconvolute_ratios
  - title: DeCovarT algorithm
    desc: |
      Covariance-aware optimisation of cellular ratios under a multivariate
      Gaussian convolution model.
  - subtitle: Score equations and simplex maps
    desc: |
      Analytic first- and second-order helpers for the unconstrained and
      ILR-constrained log-likelihood (Helmert basis; Jacobian / Hessian of
      the isometric logistic map; gradients and Hessians of \(\ell\)).
      Documented for
      `?` / source inspection; see also
      `vignette("theory-decovart-generative-model")`.
    contents:
      - helmert_basis
      - isometric_logistic
      - isometric_log_ratio
      - jacobian_isometric_logistic
      - hessian_isometric_logistic
      - starting_simplex
      - gradient_loglik_unconstrained
      - hessian_loglik_unconstrained
      - gradient_loglik_constrained
      - hessian_loglik_constrained
  - subtitle: Core optimiser
    desc: |
      Marquardt–Levenberg deconvolution (exported entry point). Related
      first- and second-order variants live in
      `R/02_02_decovart_estimate_ratios.R`. The S3 model
      wrapper is `fit_decovart()`.
    contents:
      - deconvolute_ratios_Marquardt_Levenberg
      - fit_decovart
  - subtitle: Multiple starts
    desc: |
      Refits from Dirichlet starts, the direct probe of multimodality of the
      convolution log-likelihood (`R/02_02_decovart_estimate_ratios.R`).
    contents:
      - multistart_decovart
  - subtitle: Interior intervals
    desc: |
      Intervals for compositions in the open simplex: expected Fisher
      information, ILR delta-method (Wald) covariance used by `vcov()` /
      `confint()` on `decovart_fit` objects, and profile-likelihood
      intervals that invert the Wilks calibration
      (`R/03_01_interior_intervals.R`).
    contents:
      - expected_fisher_unconstrained
      - vcov_ilr_delta
      - confint_profile_decovart
  - subtitle: Boundary tests
    desc: |
      Maximum likelihood on simplex faces, likelihood-ratio tests with
      chi-bar-square (Chernoff / Self--Liang) calibration when a null lies on
      a face, edge or vertex, and the boundary diagnostics that a bare
      convergence code cannot provide (`R/03_02_boundary_tests.R`). See
      `vignette("theory-DeCovarT-MLE-properties")`.
    contents:
      - restricted_mle_decovart
      - lrt_decovart
      - chi_bar_square_pvalue
      - boundary_diagnostics
  - subtitle: Resampling inference
    desc: |
      Parametric bootstrap (percentile intervals and Monte Carlo calibration
      of boundary tests), reference-sample bootstrap over donors or cells,
      and the label-equivariance check (`R/03_03_resampling_inference.R`).
    contents:
      - bootstrap_decovart
      - reference_bootstrap_decovart
      - equivariance_check_decovart
  - title: Benchmark and evaluation
    desc: |
      Quality metrics for estimated proportions, and the simulation
      benchmark wrapper.
    contents:
      - compute_benchmark_metrics
      - coverage_mc_interval
      - run_simulation_benchmark
      - deconvolute_ratios
      - pivot_mc_estimates
      - plot_mc_raincloud
      - plot_mc_forest
      - theme_decovart_facets
      - algorithm_similarity
      - plot_algorithm_similarity
      - plot_mc_metric_dots
      - plot_correlation_Heatmap
  - title: Simulation
  - subtitle: Toy bulk mixtures
    desc: |
      Simulate bulk mixtures as convolutions of multivariate Gaussians, and
      hierarchical GRN moments with graph-constrained covariances.
    contents:
      - generate_mean_signature_matrix
      - equicorrelation_gram
      - simulate_bulk_mixture
      - simulate_hierarchical_grn_moments
      - describe_simulation_scenario
  - title: Statistical metrics
    desc: |
      Simplex repair, Shannon entropy, MixSim overlap, Jeffreys divergence,
      and glmnet gene scores for signature design.
    contents:
      - repair_simplex
      - compute_shannon_entropy
      - composition_from_entropy
      - check_true_theta
      - compute_average_overlap
      - overlap_gaussian_mc
      - spd_affine_invariant_distance
      - compute_average_riemannian
      - scale_covariance_array
      - compute_average_jeffreys
      - compute_glmnet_gene_scores

articles:
  - title: External resources
    contents:
      - decovart-paper-slides
  - title: Getting started
    navbar: ~
    contents:
      - theory-synthetic-scenarios-mean-covariance
      - theory-distance-covariance
      - supp-S6-feature-selection
      - theory-network-inference
  - title: "Paper: numerical simulation study"
    desc: |
      The two simulation scenarios of the DeCovarT article.
      **§ 2.1** Bivariate toy (J = 2, G = 2): factorial sweep of gene–gene
      correlation, mean distance, and composition.
      **§ 2.2** Covariance-driven hybrid (J = 3, G = 20): fixed Gram
      (cosines 0.9 / 0.1), $2^2$ scale-free / cluster-SBM assignments
      on the mean-collinear types $\times$ three target MixSim
      average overlaps (precision zeros kept), Shannon $H^{\star}$
      compositions.
    navbar: ~
    contents:
      - fig02-bivariate-toy
      - fig03-covariance-driven
  - title: Mathematics
    contents:
      - theory-decovart-generative-model
      - theory-DeCovarT-MLE-properties
      - theory-review-distribution-aware-deconvolution
      - theory-decovart-single-cell-tailored
      - theory-decovart-bayesian-wiener
      - theory-decovart-extensions-roadmap
      - theory-mixture-regression-applications
  - title: Supplementary simulation appendix
    desc: |
      Regular-case MLE checks in the open simplex, identifiability
      edge cases, and covariance / scaling / misspecification studies.
    contents:
      - supp-S1-identifiability
      - supp-S2-covariance-inversion
      - supp-S3-scaling
