url: https://bastienchassagnol.github.io/DeCovarT/

title: DeCovarT
description: >-
  Bulk transcriptomic deconvolution that accounts for gene–gene covariance
  in purified reference populations.

development:
  mode: auto

template:
  bootstrap: 5
  light-switch: true
  # KaTeX supports the AMS-style maths used throughout the vignettes,
  # including \boldsymbol, without additional runtime macro configuration.
  math-rendering: katex
  theme: tango
  theme-dark: nord
  bslib:
    # Light theme (Stan pkgdown-config palette)
    bg: "#FEFBF2"
    fg: "#052744"
    primary: "#3E8EBC"
    link-color: "#3E8EBC"
    code-bg: "#FEFCF9"
    code-color: "#053A42"
    body-secondary-color: "#053A42"
    navbar-light-bg: "#052744"
    navbar-light-color: "#F2E5BD"
    navbar-light-hover-color: "#F2E5BD"
    navbar-light-active-color: "#93B0F1"
    navbar-light-brand-color: "#F2E5BD"
    navbar-light-brand-hover-color: "#F2E5BD"
    # Dark theme
    body-bg-dark: "#181818"
    body-color-dark: "#FAF1E4"
    link-color-dark: "#AED1E4"
    code-bg-dark: "#242424"
    code-color-dark: "#FEFCF9"
    navbar-dark-bg: "#303030"
    navbar-dark-color: "#FAF1E4"
    navbar-dark-hover-color: "#FAF1E4"
    navbar-dark-active-color: "#AED1E4"
    navbar-dark-brand-color: "#FAF1E4"
    navbar-dark-brand-hover-color: "#FAF1E4"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}

navbar:
  structure:
    left:
      - home
      - reference
      - articles
      - news
    right:
      - search
      - github
      - lightswitch
  components:
    home:
      text: Home
      icon: fa-home
      href: index.html
    reference:
      text: Functions
      icon: fa-code
      href: reference/index.html
    articles:
      text: Vignettes
      icon: fa-book-open
      menu:
        - text: Doctorants seminar slides (embedded)
          icon: fa-chalkboard-user
          href: articles/deconvolution-seminar-slides.html
        - text: -------
        - text: Getting started
        - text: Simulating semi-synthetic pseudo-bulk mixtures
          icon: fa-flask
          href: articles/synthetic-scenarios.html
        - text: Random Gaussian Markov network generation
          icon: fa-share-alt
          href: articles/random-network-generation.html
        - text: In silico GRN inference
          icon: fa-project-diagram
          href: articles/network-inference.html
        - text: Deconvolution use cases with DeCovarT
          icon: fa-chart-pie
          href: articles/DeCoVart-use-cases.html
        - text: -------
        - text: Mathematics
        - text: Simplex coordinate maps (ALR / additive logistic)
          icon: fa-calculator
          href: articles/DeCovarT-numerical-derivatives.html
        - text: Softmax and ALR derivatives
          icon: fa-square-root-variable
          href: articles/softmax-alr-derivatives.html
    news:
      text: News
      icon: fa-newspaper
      href: news/index.html
    github:
      icon: fa-github
      href: https://github.com/bastienchassagnol/DeCovarT/
      aria-label: GitHub

home:
  links:
    - text: Report a bug
      href: https://github.com/bastienchassagnol/DeCovarT/issues

reference:
  - title: Main deconvolution function
    desc: |
      Top-level function to deconvolve a matrix of bulk expression samples
      using any combination of deconvolution algorithms in parallel.
    contents:
      - deconvolute_ratios
  - title: DeCovarT algorithm
    desc: |
      Covariance-aware optimisation of cellular ratios under a multivariate
      Gaussian convolution model.
  - subtitle: Core optimiser
    desc: |
      Marquardt–Levenberg deconvolution (exported entry point). Related
      first- and second-order variants live in
      `R/03_03_DeCovarT_estimate_ratios_frequentist.R`.
    contents:
      - deconvolute_ratios_Marquardt_Levenberg
  - subtitle: Parametrisation
    desc: |
      Additive logistic transform between the unconstrained parameter space
      \(\mathbb{R}^{J-1}\) and the unit simplex \(\Delta^{J-1}\).
    contents:
      - additive_logistic
  - title: Benchmark and evaluation
    desc: |
      Quality metrics for estimated proportions, and the bivariate toy
      convolution benchmark.
    contents:
      - compute_benchmark_metrics
      - benchmark_bivariate_gaussian_convolutions
      - plot_correlation_Heatmap
  - title: Simulation
  - subtitle: Toy bulk mixtures
    desc: |
      Simulate bulk mixtures as convolutions of multivariate Gaussians, and
      hierarchical GRN moments with graph-constrained covariances.
    contents:
      - simulate_bulk_mixture
      - simulate_hierarchical_grn_moments
  - title: Utilities
    desc: |
      Simplex projection, Shannon entropy, and average pairwise overlap used
      when designing synthetic scenarios.
    contents:
      - enforce_identifiability
      - compute_shannon_entropy
      - compute_average_overlap

articles:
  - title: Presentations
    contents:
      - deconvolution-seminar-slides
  - title: Getting started
    navbar: ~
    contents:
      - synthetic-scenarios
      - random-network-generation
      - network-inference
      - DeCoVart-use-cases
  - title: Mathematics
    contents:
      - DeCovarT-numerical-derivatives
      - softmax-alr-derivatives

news:
  releases:
    - text: Version 0.1.0 (development)
      href: https://github.com/bastienchassagnol/DeCovarT/blob/main/NEWS.md
