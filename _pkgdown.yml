reference:
  - title: Main deconvolution function
    desc: |
      Top-level function to deconvolve a matrix of bulk expression samples
      using any combination of deconvolution algorithms in parallel.
    contents:
      - deconvolute_ratios
  - title: DeCovarT algorithm
    desc: |
      Covariance-aware optimisation of cellular ratios under a multivariate
      Gaussian convolution model.
  - subtitle: Score equations and simplex maps
    desc: |
      Analytic first- and second-order helpers for the unconstrained and
      ALR-constrained log-likelihood (Jacobian / Hessian of the additive
      logistic map; gradients and Hessians of \(\ell\)). Documented for
      `?` / source inspection; see also
      `vignette("generative-model-derivatives")`.
    contents:
      - additive_logistic
      - additive_log_ratio
      - jacobian_additive_logistic
      - hessian_additive_logistic
      - gradient_loglik_unconstrained
      - hessian_loglik_unconstrained
      - gradient_loglik_constrained
      - hessian_loglik_constrained
  - subtitle: Core optimiser
    desc: |
      Marquardt–Levenberg deconvolution (exported entry point). Related
      first- and second-order variants live in
      `R/03_03_DeCovarT_estimate_ratios_frequentist.R`. The S3 model
      wrapper is `fit_decovart()`.
    contents:
      - deconvolute_ratios_Marquardt_Levenberg
      - fit_decovart
  - subtitle: Fisher information and Wald intervals
    desc: |
      Expected Fisher information of unconstrained proportions and ALR
      delta-method covariance used by `vcov()` / `confint()` on
      `decovart_fit` objects (see `fit_decovart`).
    contents:
      - expected_fisher_unconstrained
      - vcov_alr_delta
  - subtitle: Likelihood-ratio and boundary inference
    desc: |
      Profile likelihood, likelihood-ratio tests with chi-bar-square
      (Chernoff / Self--Liang) calibration on simplex faces, parametric
      bootstrap, reference-sample bootstrap (donors, cells, or Dirichlet
      compositions), and the boundary / multimodality diagnostics that a
      bare convergence code cannot provide. See
      `vignette("DeCovarT-MLE-properties")`.
    contents:
      - restricted_mle_decovart
      - profile_loglik_decovart
      - lrt_decovart
      - confint_profile_decovart
      - chi_bar_square_pvalue
      - bootstrap_decovart
      - reference_bootstrap_decovart
      - equivariance_check_decovart
      - boundary_diagnostics
      - multistart_decovart
  - title: Benchmark and evaluation
    desc: |
      Quality metrics for estimated proportions, and the simulation
      benchmark wrapper.
    contents:
      - compute_benchmark_metrics
      - run_simulation_benchmark
      - deconvolute_ratios
      - plot_correlation_Heatmap
  - title: Simulation
  - subtitle: Toy bulk mixtures
    desc: |
      Simulate bulk mixtures as convolutions of multivariate Gaussians, and
      hierarchical GRN moments with graph-constrained covariances.
    contents:
      - generate_mean_signature_matrix
      - simulate_bulk_mixture
      - simulate_hierarchical_grn_moments
  - title: Statistical metrics
    desc: |
      Simplex repair, Shannon entropy, MixSim overlap, Jeffreys divergence,
      and glmnet gene scores for signature design.
    contents:
      - repair_simplex
      - compute_shannon_entropy
      - check_true_theta
      - compute_average_overlap
      - compute_average_jeffreys
      - compute_glmnet_gene_scores

articles:
  - title: Manuscript
    contents:
      - decovart-manuscript
  - title: Presentations
    contents:
      - deconvolution-seminar-slides
  - title: Getting started
    navbar: ~
    contents:
      - synthetic-scenarios
      - feature-selection
      - network-inference
      - DeCovarT-manuscript-scenarios
  - title: Mathematics
    contents:
      - generative-model-derivatives
      - DeCovarT-MLE-properties
      - DeCovarT-reminders-OLS
      - decovart-perspectives
  - title: Appendix simulations
    desc: |
      Edge-case numerical checks behind the `decovart_fit` API: gene-wise
      z-score / affine equivariance of the MLE, failure under collinear
      signatures, impact of small bulk perturbations under full /
      cell-type-diagonal / global covariances, and sensitivity of
      second-order solvers to random ALR starts.
    contents:
      - DeCovarT_appendix_simualtion_frameworks

