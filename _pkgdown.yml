reference:
  - title: Simplex chart
    desc: |
      Shared by both generative models (`R/02_00_ilr_chart.R`): simplex
      repair, the Helmert basis and the isometric log-ratio (ILR) chart with
      its first and second derivatives.
    contents:
      - repair_simplex
      - helmert_basis
      - isometric_logistic
      - isometric_log_ratio
      - jacobian_isometric_logistic
      - hessian_isometric_logistic
  - title: "Population references: Gaussian convolution"
    desc: |
      Bulk covariance \(\sum_j p_j^2\Sigma_j\) (article Section
      "Population-level references").
  - subtitle: Optimisation
    desc: |
      Log-likelihood, score and Hessian, the solver family (Newton--Raphson
      by default, with the PORT trust region of `stats::nlminb`), starting
      values and multistarts (`R/02_02_population_decovart_estimate_ratios.R`,
      `R/02_03_population_decovart_fit.R`).
    contents:
      - fit_decovart
      - deconvolute_ratios_Marquardt_Levenberg
      - starting_simplex
      - multistart_decovart
      - loglik_multivariate
      - gradient_loglik_unconstrained
      - hessian_loglik_unconstrained
      - gradient_loglik_constrained
      - hessian_loglik_constrained
  - subtitle: Inference
    desc: |
      Confidence intervals and tests (`R/03_01` to `R/03_03`): the
      `confint_decovart()` menu (ILR back-transformation by default, Wald,
      Firth, profile likelihood, parametric and reference bootstraps),
      restricted fits on simplex faces and chi-bar-square tests.
    contents:
      - confint_decovart
      - confint_ilr_backtransform
      - expected_fisher_unconstrained
      - vcov_ilr_delta
      - fit_firth_decovart
      - confint_profile_decovart
      - restricted_mle_decovart
      - lrt_decovart
      - chi_bar_square_pvalue
      - boundary_diagnostics
      - bootstrap_decovart
      - reference_bootstrap_decovart
      - equivariance_check_decovart
  - title: "Single-cell references: mixture of independent cells"
    desc: |
      Bulk covariance \(\phi\sum_j p_j\Sigma_{W,j}\) with a mean scale \(c\)
      and a variance scale \(\phi\) (article Section "Single-cell
      references").
  - subtitle: Optimisation
    desc: |
      Free-scale least-squares start, closed-form scales, and Newton--Raphson
      on the profile log-likelihood (`R/02_02_single_cell_decovart_estimate_ratios.R`).
    contents:
      - deconvolute_single_cell
      - single_cell_nuisance_scales
      - loglik_single_cell
      - profile_loglik_single_cell_ilr
  - subtitle: Inference
    desc: |
      The `confint_single_cell()` menu, with intervals for the composition
      and for the two scales (`R/03_04_single_cell_inference.R`).
    contents:
      - confint_single_cell
      - vcov_single_cell
      - fit_firth_single_cell
      - confint_profile_single_cell
      - restricted_mle_single_cell
      - lrt_single_cell
      - bootstrap_single_cell
      - reference_bootstrap_single_cell
  - title: Generative models
  - subtitle: Population references
    desc: |
      Mean signatures with prescribed pairwise cosines, graph-constrained
      cell-type covariances, and bulk samples drawn from the Gaussian
      convolution (`R/01_01_population_toy_simulation.R`,
      `R/01_02_generate_synthetic_networks.R`).
    contents:
      - generate_mean_signature_matrix
      - simulate_hierarchical_grn_moments
      - simulate_bulk_mixture
  - subtitle: Single-cell references
    desc: |
      Cell-size conventions, the four-scenario design, and bulk samples
      drawn as sums of multinomial counts of cells
      (`R/01_01_single_cell_toy_simulation.R`,
      `R/01_02_single_cell_generate_synthetic_networks.R`).
    contents:
      - simulate_bulk_from_cells
      - rescale_single_cell_moments
      - single_cell_scenario_design
  - subtitle: Reference panels
    desc: |
      Independent purified profiles or cells per individual, for benchmark
      methods that estimate the reference moments themselves
      (`R/01_06_reference_replicates.R`).
    contents:
      - simulate_reference_replicates
  - title: Benchmark
  - subtitle: Run
    desc: |
      Fit every algorithm to every bulk sample, over a scenario grid
      (`R/04_01_run_benchmark.R`, `R/04_02_run_simulation_benchmark.R`).
    contents:
      - deconvolute_ratios
      - run_simulation_benchmark
      - describe_simulation_scenario
  - subtitle: Metrics
    desc: |
      Global and per-cell-type performance scores, Monte Carlo coverage
      (`R/04_03`, `R/04_04`), and scenario descriptors: entropy of the
      composition, overlap and divergences between cell-type distributions
      (`R/01_03` to `R/01_05`).
    contents:
      - compute_benchmark_metrics
      - population_likelihood
      - single_cell_likelihood
      - kkt_residual
      - coverage_mc_interval
      - compute_shannon_entropy
      - composition_from_entropy
      - compute_average_overlap
      - overlap_gaussian_mc
      - compute_average_riemannian
      - compute_average_jeffreys
      - hellinger_gaussian
      - scale_covariance_array
      - scale_covariances_to_overlap
  - subtitle: Visualisation
    desc: |
      Monte Carlo plots and algorithm-similarity heatmaps of a benchmark
      (`R/05_01_monte_carlo_plots.R`, `R/05_02_algorithm_similarity.R`).
    contents:
      - pivot_mc_estimates
      - plot_mc_raincloud
      - plot_mc_forest
      - plot_mc_metric_dots
      - algorithm_similarity
      - plot_algorithm_similarity
      - theme_decovart_facets

articles:
  - title: External resources
    contents:
      - decovart-paper-slides
  - title: "Theory 1 · Population-level references"
    desc: |
      Gaussian convolution of population profiles: the generative model,
      its derivatives and the two solvers, then the MLE properties and
      the confidence intervals.
    contents:
      - 01-1-population-generative-optimisation
      - 01-2-population-inference
  - title: "Theory 2 · Single-cell references"
    desc: |
      Mixture of independent cells with two technical scales: reference
      moments, alignment strategies and the profile fit, then the profile
      information, the intervals and the REML calibration.
    contents:
      - 02-1-single-cell-generative-optimisation
      - 02-2-single-cell-inference
  - title: "Theory 3 · Estimating the reference: genes and covariances"
    desc: |
      Which genes enter the reference, and how each cell type's
      covariance is estimated before it is plugged into the likelihood.
    contents:
      - 03-1-feature-selection
      - 03-2-covariance-network-estimation
      - 03-3-precision-networks
  - title: "Theory 4 · Benchmark design"
    desc: |
      Synthetic mean and covariance scenarios (ADEMP), and the distances
      and overlap scores that describe them.
    contents:
      - 04-1-synthetic-scenarios
      - 04-2-distances-overlap-metrics
  - title: "Theory 5 · Review and perspectives"
    contents:
      - 05-1-review-distribution-aware
      - 05-2-bayesian-wiener
      - 05-3-extensions-roadmap
      - 05-4-mixture-experiments
  - title: "Simulation study (article §2)"
    desc: |
      The three simulation scenarios of the DeCovarT article.
      **§2.2** Bivariate toy (J = 2, G = 2): factorial sweep of gene–gene
      correlation, mean distance, and composition.
      **§2.3** Covariance-driven hybrid (J = 3, G = 20): fixed Gram
      (cosines 0.9 / 0.1), $2^2$ scale-free / cluster-SBM assignments
      on the mean-collinear types $\times$ three target MixSim
      average overlaps (precision zeros kept), Shannon $H^{\star}$
      compositions.
      **§2.4** Single-cell reference, two lineages (J = 4): sibling
      cosine 0.8, lineage stochastic block models with scale-free or hub
      children, $2^6 = 64$ crossed scenarios (composition, sibling
      overlap, cells per bulk, cell sizes, genes, platform scale 1 or 5).
    contents:
      - R1-bivariate-toy
      - R2-covariance-driven
      - R3-single-cell-hierarchical
  - title: Supplementary appendix
    desc: |
      Regular-case MLE checks in the open simplex, identifiability
      edge cases, covariance / scaling / misspecification studies, and a
      synthetic scenario for comparing gene-screening strategies.
    contents:
      - S1-identifiability
      - S2-covariance-inversion
      - S3-scaling
      - S4-covariance-modeling
      - S5-misspecification
      - S6-feature-screening-scenario

