url: https://bastienchassagnol.github.io/DeCovarT/

title: DeCovarT
description: >-
  Bulk transcriptomic deconvolution that accounts for gene–gene covariance
  in purified reference populations.

development:
  mode: auto

template:
  bootstrap: 5
  light-switch: true
  includes:
    after_body: |
      <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
      <script>
      (function () {
        function blocks() {
          return Array.from(
            document.querySelectorAll(
              "pre code.language-mermaid, pre code.mermaid, pre code[class*='language-mermaid']"
            )
          );
        }
        function rewrite(nodes) {
          return nodes.map(function (code, i) {
            var pre = code.closest("pre");
            if (!pre) return null;
            var div = document.createElement("div");
            div.className = "mermaid";
            div.id = "pkgdown-mermaid-" + i;
            div.textContent = code.textContent || "";
            pre.replaceWith(div);
            return div;
          }).filter(Boolean);
        }
        async function run() {
          if (!window.mermaid) return;
          var m = blocks();
          if (!m.length) return;
          var nodes = rewrite(m);
          window.mermaid.initialize({
            startOnLoad: false,
            theme: "sandstone",
            securityLevel: "loose"
          });
          try { await window.mermaid.run({ nodes: nodes }); }
          catch (e) { console.warn("Mermaid render failed:", e); }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", run);
        } else {
          run();
        }
      })();
      </script>
  # KaTeX supports the AMS-style maths used throughout the vignettes,
  # including \boldsymbol, without additional runtime macro configuration.
  math-rendering: katex
  theme: tango
  theme-dark: nord
  bslib:
    # Light theme (Stan pkgdown-config palette)
    bg: "#FEFBF2"
    fg: "#052744"
    primary: "#3E8EBC"
    link-color: "#3E8EBC"
    code-bg: "#FEFCF9"
    code-color: "#053A42"
    body-secondary-color: "#053A42"
    navbar-light-bg: "#052744"
    navbar-light-color: "#F2E5BD"
    navbar-light-hover-color: "#F2E5BD"
    navbar-light-active-color: "#93B0F1"
    navbar-light-brand-color: "#F2E5BD"
    navbar-light-brand-hover-color: "#F2E5BD"
    # Dark theme
    body-bg-dark: "#181818"
    body-color-dark: "#FAF1E4"
    link-color-dark: "#AED1E4"
    code-bg-dark: "#242424"
    code-color-dark: "#FEFCF9"
    navbar-dark-bg: "#303030"
    navbar-dark-color: "#FAF1E4"
    navbar-dark-hover-color: "#FAF1E4"
    navbar-dark-active-color: "#AED1E4"
    navbar-dark-brand-color: "#FAF1E4"
    navbar-dark-brand-hover-color: "#FAF1E4"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}

