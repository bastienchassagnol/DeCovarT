# rOpenSci pkgcheck on the package (R CMD check, goodpractice, exports,
# documentation, tests). From https://github.com/ropensci-review-tools/pkgcheck-action.
# scripts/ is in .Rbuildignore, so pkgcheck never sees it; the pre-commit
# hook `no-decovart-internals` guards scripts/ and vignettes/ instead.
name: pkgcheck

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # A push to main starts the workflow; the job runs only when the
  # commit message contains "run pkgcheck" (see the job `if` below).
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        contains(github.event.head_commit.message, 'run pkgcheck')
      )
    permissions:
      issues: write
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
