# Workflow inspired by:
# https://github.com/quarto-ext/.github/blob/main/.github/workflows/render-readme.yaml
# Preferred PR behaviour: verify committed README.md (contents: read).
# On push to main: optionally commit a fresh render (contents: write).

on:
  push:
    branches: [main, master]
    paths:
      - README.qmd
      - README.md
      - man/figures/decovart_constrained_dag.mmd
      - .github/workflows/render-readme.yaml
  pull_request:
    paths:
      - README.qmd
      - README.md
      - man/figures/decovart_constrained_dag.mmd
      - .github/workflows/render-readme.yaml
  workflow_dispatch:

name: render-readme

permissions:
  contents: read

jobs:
  render-readme:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Set up Node.js (latest LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr stack for README.qmd
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render README
        run: quarto render README.qmd

      - name: Verify committed README.md on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md

      - name: Commit rendered README on main
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if [ -d README_files ]; then
            git add README_files
          fi
          git diff --cached --quiet && echo "No README changes to commit" && exit 0
          git commit -m 'docs: render README.md from README.qmd'
          git push
