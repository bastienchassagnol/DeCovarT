# Sequential R package validation and deployment pipeline.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
          - none
      custom_version:
        description: "Custom version (optional; overrides version_type)"
        required: false
        type: string

# pkgcheck matches workflow run names against "cmd|coverage"
name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # R CMD check uses --vanilla (skips ~/.Rprofile); set here instead.
      _R_CHECK_SYSTEM_CLOCK_: "false"

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  test-coverage:
    name: test-coverage
    # Only when the triggering commit message mentions "test coverage".
    # `contains()` is case-insensitive for strings (no toLower in GHA).
    # Skipped runs do not block pkgdown (pkgdown needs R-CMD-check only).
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'test coverage')
    needs: R-CMD-check
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' \
            -exec cat '{}' \; || true
        shell: bash

  pkgdown:
    name: pkgdown
    needs: R-CMD-check
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::pkgdown, any::visNetwork, github::r-lib/pkgapi, local::.
          needs: website

      - name: Generate function call network
        run: Rscript scripts/generate_package_network_functions.R

      # 1) Reveal.js deck first (COPASI-style: slides before the rest of Quarto)
      - name: Render Quarto reveal.js slides
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: revealjs
          path: slides/index.qmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload slides HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: slides-generation
          path: slides/index.html
          if-no-files-found: error

      # 2) Remaining Quarto (pkgdown vignettes / articles) + site
      - name: Build pkgdown site
        run: >-
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )
        shell: Rscript {0}

      - name: Copy slides into pkgdown docs
        run: |
          mkdir -p docs/slides
          cp -a slides/index.html docs/slides/index.html

      - name: Copy function network into pkgdown docs
        run: |
          mkdir -p docs/package_network
          cp -a output/package_network/. docs/package_network/
          test -f docs/package_network/decovart_function_network.html

      # Optional: Nature Methods article PDF when the commit message asks for it
      - name: Install TeX Live (article generation)
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, 'article generation')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-bibtex-extra \
            biber

      - name: Build article PDF with latexmk
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, 'article generation')
        working-directory: article
        run: |
          latexmk -pdf -f -interaction=nonstopmode -file-line-error \
            -synctex=1 main.tex
          test -f main.pdf

      - name: Upload article PDF artifact
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, 'article generation')
        uses: actions/upload-artifact@v7
        with:
          name: article-main-pdf
          path: article/main.pdf
          if-no-files-found: error

      - name: Copy article PDF into pkgdown docs
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, 'article generation')
        run: |
          mkdir -p docs/article
          cp -a article/main.pdf docs/article/main.pdf
          test -f docs/article/main.pdf

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

  update-version:
    name: Update R package version
    needs: pkgdown
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: version-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install desc
        run: install.packages("desc", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: version_bump
        run: |
          INPUT_TYPE="${{ github.event.inputs.version_type }}"
          CUSTOM_VERSION="${{ github.event.inputs.custom_version }}"
          BUMP_TYPE="none"

          if [ -n "$CUSTOM_VERSION" ]; then
            echo "Using custom version: $CUSTOM_VERSION"
            echo "type=custom" >> "$GITHUB_OUTPUT"
            echo "custom_version=$CUSTOM_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$INPUT_TYPE" ] && [ "$INPUT_TYPE" != "none" ]; then
            BUMP_TYPE="$INPUT_TYPE"
            echo "Bump type from workflow input: $BUMP_TYPE"
          else
            commit_msg=$(git log -1 --pretty=%B | tr '[:upper:]' '[:lower:]')
            if echo "$commit_msg" |
              grep -qE '(^|[^a-z])(major|breaking)([^a-z]|$)|feat!'
            then
              BUMP_TYPE="major"
            elif echo "$commit_msg" |
              grep -qE '(^|[^a-z])(feat|feature|minor)([^a-z]|$)'
            then
              BUMP_TYPE="minor"
            elif echo "$commit_msg" |
              grep -qE '(^|[^a-z])(patch|fix|bug|docs|chore)([^a-z]|$)'
            then
              BUMP_TYPE="patch"
            fi
            echo "Bump type from commit message: $BUMP_TYPE"
          fi

          if git log -1 --pretty=%B | grep -qi '\[ci skip\]'; then
            BUMP_TYPE="none"
            echo "Skipping bump: previous commit marked [ci skip]"
          fi

          echo "type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

      - name: Update version in DESCRIPTION
        if: steps.version_bump.outputs.type != 'none'
        run: |
          CURRENT_VERSION=$(
            Rscript -e 'cat(as.character(desc::desc_get_version()))'
          )
          echo "Current version: $CURRENT_VERSION"

          BUMP_TYPE="${{ steps.version_bump.outputs.type }}"
          CUSTOM_VERSION="${{ steps.version_bump.outputs.custom_version }}"

          if [ "$BUMP_TYPE" = "custom" ] && [ -n "$CUSTOM_VERSION" ]; then
            NEW_VERSION="$CUSTOM_VERSION"
            Rscript -e "desc::desc_set_version('$NEW_VERSION')"
          else
            Rscript -e "desc::desc_bump_version('$BUMP_TYPE')"
            NEW_VERSION=$(
              Rscript -e 'cat(as.character(desc::desc_get_version()))'
            )
          fi

          echo "New version: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Update version badges in README sources
        if: steps.version_bump.outputs.type != 'none'
        run: |
          for f in README.md README.qmd README.Rmd; do
            if [ -f "$f" ]; then
              if grep -q 'badge/devel%20version-' "$f"; then
                sed -i \
                  "s/\(badge\/devel%20version-\)[0-9.]\+/\1${NEW_VERSION}/g" \
                  "$f"
                echo "Updated $f version badge to $NEW_VERSION"
              else
                echo "No devel-version badge pattern in $f; skipping."
              fi
            fi
          done

      - name: Commit and tag version update
        if: steps.version_bump.outputs.type != 'none'
        run: |
          git add DESCRIPTION
          for f in README.md README.qmd README.Rmd; do
            [ -f "$f" ] && git add "$f" || true
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Bump version to ${NEW_VERSION} [ci skip]"

          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists; skipping."
          else
            git tag -a "v${NEW_VERSION}" -m "Version ${NEW_VERSION}"
          fi

      - name: Push changes and tags
        if: steps.version_bump.outputs.type != 'none'
        run: |
          git push origin HEAD:"${GITHUB_REF_NAME}"
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            git push origin "v${NEW_VERSION}" || true
          fi
